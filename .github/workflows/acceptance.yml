name: Synthetic warehouse acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fmcg_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: fmcg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fmcg_ci -d fmcg_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      FMCG_TEST_DATABASE_URL: postgresql://fmcg_ci:disposable_ci_only@127.0.0.1:5432/fmcg_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild integrated candidate with required database acceptance
        run: python scripts/run_candidate.py
      - name: Validate generated Q4 browser filter script
        run: node scripts/test_q4_filters.js
      - name: Retain logs and reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-acceptance-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
