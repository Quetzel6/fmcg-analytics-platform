services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fmcg
      POSTGRES_USER: fmcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fmcg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmcg -d fmcg"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  fmcg_pg:
